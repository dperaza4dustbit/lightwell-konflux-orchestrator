---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: javascript-validated-build
  labels:
    # Conforma pipeline-required-tasks selector (see plumbing/policy-data/).
    pipelines.openshift.io/runtime: build-npm-compliance
spec:
  description: |
    Lightwell JavaScript validated npm factory build (orchestrator-driven).
    Clones the recipe monorepo, optionally rewrites manifests for SCRATCH
    publish-version overrides, builds one package directory
    (packages/<name>/<version>), runs assess-npm-compliance, and pushes a
    durable :<tag>.npm snapshot OCI. Unlike the PAC PoC pipelines, package
    selection is an explicit param (no git-diff identify step).
  params:
    - name: git-url
      type: string
      description: Recipe monorepo URL (calunga-javascript build-configs)
    - name: revision
      type: string
      description: Git revision of the recipe monorepo to build
      default: ""
    - name: output-image
      description: Durable Quay tag prefix; npm packages land at $(output-image).npm
      type: string
    - name: packages
      description: >-
        Package directories to build, e.g. ["packages/bluebird/3.7.2"]
      type: array
    - name: image-expires-after
      description: Empty for durable snapshot tags
      type: string
      default: ""
    - name: git-clone-depth
      type: string
      default: "0"
    - name: builder-image
      description: Pinned npm-builder (BUILDER_IMAGE for build/assess)
      type: string
    - name: task-build-npm-package-bundle
      description: Tekton bundle image for build-npm-package-oci-ta
      type: string
    - name: task-assess-npm-compliance-bundle
      description: >-
        Tekton bundle image for assess-npm-compliance-oci-ta
        (Quay component still named task-promote-npm-oci)
      type: string
    - name: publish-to-pulp
      description: When true, also npm publish to Pulp Stage (future; requires stage secret)
      type: string
      default: "false"
    - name: pulp-npm-registry-url
      description: Pulp Stage npm registry URL (only when publish-to-pulp is true)
      type: string
      default: ""
    - name: tl-npm-registry-url
      description: >-
        Read-only npm registry used by assess-npm-compliance for dependency
        closure (Lightwell validated Pulp content URL; prod by default,
        orchestrator overrides per --target)
      type: string
      default: "https://packages.redhat.com/api/pulp-content/lightwell/javascript/validated"
    - name: pulp-read-secret-name
      description: >-
        Secret with Pulp read basic-auth for tl-npm-registry-url
        (SERVICE_ACCOUNT_USERNAME/SERVICE_ACCOUNT_PASSWORD). Lightwell must
        pass a real Secret name (default lightwell-pulp-read-secret). The
        assess Task defaults to does-not-exist so Calunga/public-TL runs do
        not mount credentials.
      type: string
      default: lightwell-pulp-read-secret
    - name: lightwell-publish-version-override
      description: >-
        When non-empty (SCRATCH), resolve-npm-source-artifact rewrites recipe
        manifests to this version before build/assess. When empty, that task
        passthroughs the clone SOURCE_ARTIFACT. npm-builder is unaware of the
        override on the Konflux path.
      type: string
      default: ""
    - name: npm-publish-secret-name
      type: string
      default: rhtl-pulp-npm-stage-credentials
    - name: skip-checks
      type: string
      default: "false"
    - name: rebuild
      type: string
      default: "false"
  results:
    - name: IMAGE_URL
      value: $(tasks.assess-npm-compliance.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.assess-npm-compliance.results.IMAGE_DIGEST)
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
  tasks:
    - name: init
      params:
        - name: image-url
          value: $(params.output-image)
        - name: rebuild
          value: $(params.rebuild)
        - name: skip-checks
          value: $(params.skip-checks)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:5f687152ab0661f84830877de93a8ec45cb0b756f71b24ac55133d03a4007936
          - name: kind
            value: task
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: fetchTags
          value: "true"
        - name: depth
          value: $(params.git-clone-depth)
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:3bcd4c39a346d29617013f4c47d245d38f020cdbf814cf3ce095911c528f5003
          - name: kind
            value: task
      workspaces:
        - name: basic-auth
          workspace: git-auth
    - name: resolve-npm-source-artifact
      runAfter:
        - clone-repository
      params:
        - name: PACKAGES
          value: $(params.packages[*])
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: LIGHTWELL_PUBLISH_VERSION_OVERRIDE
          value: $(params.lightwell-publish-version-override)
        - name: BUILDER_IMAGE
          value: $(params.builder-image)
        - name: ociStorage
          value: $(params.output-image).publish-version
      taskSpec:
        description: >-
          Always runs. When LIGHTWELL_PUBLISH_VERSION_OVERRIDE is empty,
          passthrough the clone SOURCE_ARTIFACT. When set (SCRATCH), unpack,
          rewrite recipe manifests (embedded manifest_publish_version.py), and
          publish a new Trusted Artifact for build/assess.
        params:
          - name: PACKAGES
            type: array
          - name: SOURCE_ARTIFACT
            type: string
          - name: LIGHTWELL_PUBLISH_VERSION_OVERRIDE
            type: string
          - name: BUILDER_IMAGE
            type: string
          - name: ociStorage
            type: string
          - name: WORKDIR_ROOT
            type: string
            default: /var/workdir
          - name: caTrustConfigMapKey
            type: string
            default: ca-bundle.crt
          - name: caTrustConfigMapName
            type: string
            default: trusted-ca
        results:
          - name: SOURCE_ARTIFACT
            description: Trusted Artifact URI for build and assess
        volumes:
          - name: trusted-ca
            configMap:
              items:
                - key: $(params.caTrustConfigMapKey)
                  path: ca-bundle.crt
              name: $(params.caTrustConfigMapName)
              optional: true
          - name: workdir
            emptyDir: {}
        stepTemplate:
          env:
            - name: WORKDIR_ROOT
              value: $(params.WORKDIR_ROOT)
            - name: SOURCE_ROOT
              value: $(params.WORKDIR_ROOT)/source
            - name: LIGHTWELL_PUBLISH_VERSION_OVERRIDE
              value: $(params.LIGHTWELL_PUBLISH_VERSION_OVERRIDE)
          volumeMounts:
            - mountPath: $(params.WORKDIR_ROOT)
              name: workdir
        steps:
          - name: use-or-passthrough
            image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:2712c8a6453fc9db5fc4c2d9d952554a4eea46d2fdba47a272b79fa07f8c8c40
            volumeMounts:
              - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
                name: trusted-ca
                readOnly: true
                subPath: ca-bundle.crt
            script: |
              #!/bin/sh
              set -eu
              if [ -z "${LIGHTWELL_PUBLISH_VERSION_OVERRIDE}" ]; then
                printf '%s' "$(params.SOURCE_ARTIFACT)" > "$(results.SOURCE_ARTIFACT.path)"
                echo "[resolve-npm-source-artifact] passthrough clone SOURCE_ARTIFACT"
                exit 0
              fi
              /usr/local/bin/entrypoint use \
                "$(params.SOURCE_ARTIFACT)=$(params.WORKDIR_ROOT)/source"
            computeResources:
              limits:
                memory: 1Gi
              requests:
                cpu: 200m
                memory: 256Mi
          - name: rewrite-manifests
            image: $(params.BUILDER_IMAGE)
            script: |
              #!/usr/bin/python3.9
              # LKO_MANIFEST_PUBLISH_VERSION_SCRIPT
              raise SystemExit(
                  "manifest_publish_version.py was not embedded; "
                  "load the pipeline via JavaScriptEcosystem.build_pipelinerun"
              )
            args:
              - $(params.LIGHTWELL_PUBLISH_VERSION_OVERRIDE)
              - $(params.PACKAGES[*])
            computeResources:
              limits:
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
          - name: create-trusted-artifact
            image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:2712c8a6453fc9db5fc4c2d9d952554a4eea46d2fdba47a272b79fa07f8c8c40
            env:
              - name: HOME
                value: /tekton/home
            volumeMounts:
              - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
                name: trusted-ca
                readOnly: true
                subPath: ca-bundle.crt
            script: |
              #!/bin/sh
              set -eu
              if [ -z "${LIGHTWELL_PUBLISH_VERSION_OVERRIDE}" ]; then
                # Result already written by use-or-passthrough.
                exit 0
              fi
              /usr/local/bin/entrypoint create \
                --store "$(params.ociStorage)" \
                "$(results.SOURCE_ARTIFACT.path)=$(params.WORKDIR_ROOT)/source"
              URI="$(cat "$(results.SOURCE_ARTIFACT.path)")"
              echo "[resolve-npm-source-artifact] SOURCE_ARTIFACT=${URI}"
            computeResources:
              limits:
                memory: 1Gi
              requests:
                cpu: 200m
                memory: 256Mi
    - name: build-npm-package
      runAfter:
        - resolve-npm-source-artifact
      params:
        - name: PACKAGES
          value: $(params.packages[*])
        - name: SOURCE_ARTIFACT
          value: $(tasks.resolve-npm-source-artifact.results.SOURCE_ARTIFACT)
        - name: BUILDER_IMAGE
          value: $(params.builder-image)
        - name: IMAGE
          value: $(params.output-image).npm
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: PULP_NPM_REGISTRY_URL
          value: $(params.pulp-npm-registry-url)
        - name: NPM_PUBLISH_SECRET_NAME
          value: $(params.npm-publish-secret-name)
        - name: PUBLISH_TO_PULP
          value: $(params.publish-to-pulp)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: build-npm-package-oci-ta
          - name: bundle
            value: $(params.task-build-npm-package-bundle)
          - name: kind
            value: task
      workspaces:
        - name: git-auth
          workspace: git-auth
    - name: assess-npm-compliance
      runAfter:
        - build-npm-package
      params:
        - name: SOURCE_IMAGE
          value: $(tasks.build-npm-package.results.IMAGE_REF)
        - name: IMAGE
          value: $(params.output-image).npm
        - name: BUILDER_IMAGE
          value: $(params.builder-image)
        - name: SOURCE_ARTIFACT
          value: $(tasks.resolve-npm-source-artifact.results.SOURCE_ARTIFACT)
        - name: PACKAGES
          value: $(params.packages[*])
        - name: PACKAGES_STATUS
          value: has-packages
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: TL_NPM_REGISTRY_URL
          value: $(params.tl-npm-registry-url)
        - name: PULP_READ_SECRET_NAME
          value: $(params.pulp-read-secret-name)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: assess-npm-compliance-oci-ta
          - name: bundle
            value: $(params.task-assess-npm-compliance-bundle)
          - name: kind
            value: task
  workspaces:
    - name: git-auth
      optional: true
